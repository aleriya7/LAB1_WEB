<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оформление билета - TicketShow</title>
    <link rel="stylesheet" href="src/css/style.css">
</head>
<body class="page">
    <header class="header">
        <h1 class="header__title">TicketShow</h1>
        <nav class="nav">
            <ul class="nav__list">
                <li class="nav__item"><a class="nav__link" href="index.html">Главная</a></li>
                <li class="nav__item"><a class="nav__link" href="catalog.html">Афиша</a></li>
                <li class="nav__item"><a class="nav__link" href="collection.html">Мои билеты (Корзина)</a></li>
                <li class="nav__item"><a class="nav__link" href="checkout.html">Оформление заказа</a></li>
            </ul>
        </nav>
    </header>

    <main class="main">
        <section class="checkout">
            <h2 class="checkout__title">Оформление билета</h2>

            <form class="form" action="/submit-order" method="POST">

                <!-- ФИО -->
                <div class="form__field">
                    <label class="form__label" for="fullName">ФИО зрителя:</label>
                    <input class="form__input" type="text" id="fullName" name="fullName" required minlength="5" placeholder="Иванов Иван Иванович">
                </div>

                <!-- Email -->
                <div class="form__field">
                    <label class="form__label" for="emailAddr">Email для отправки билета:</label>
                    <input class="form__input" type="email" id="emailAddr" name="emailAddr" required placeholder="example@mail.ru">
                </div>

                <!-- Телефон -->
                <div class="form__field">
                    <label class="form__label" for="phone">Контактный телефон:</label>
                    <input class="form__input" type="tel" id="phone" name="phone" required pattern="[0-9]{11}" placeholder="89001234567">
                </div>

                <!-- Способ получения -->
                <div class="form__field">
                    <label class="form__label" for="deliveryMethod">Способ получения:</label>
                    <select class="form__select" id="deliveryMethod" name="deliveryMethod" required>
                        <option value="">-- Выберите способ --</option>
                        <option value="electronic">Электронный билет</option>
                        <option value="box_office">В кассе</option>
                    </select>
                </div>

                <!-- Комментарий -->
                <div class="form__field">
                    <label class="form__label" for="comments">Комментарий к заказу:</label>
                    <textarea class="form__textarea" id="comments" name="comments" rows="4" maxlength="300" placeholder="Напишите ваши пожелания..."></textarea>
                </div>

                <!-- Способ оплаты -->
                <div class="form__radio-group">
                    <p class="form__radio-title">Способ оплаты:</p>
                    <label class="form__radio-item">
                        <input type="radio" id="payCard" name="paymentMethod" value="card" required>
                        Банковской картой онлайн
                    </label>
                    <label class="form__radio-item">
                        <input type="radio" id="paySbp" name="paymentMethod" value="sbp" required>
                        Через СБП
                    </label>
                </div>

                <!-- Согласие -->
                <div class="form__checkbox-item">
                    <label>
                        <input type="checkbox" id="rulesAccept" name="rulesAccept" required>
                        Я согласен с правилами возврата билетов
                    </label>
                </div>

                <!-- Кнопка: микс .button + .form__submit -->
                <button class="button button--primary form__submit" type="submit">Оформить заказ</button>
            </form>
        </section>
    </main>

    <footer class="footer">
        <p class="footer__text">&copy; 2026 TicketShow. Все права защищены.</p>
    </footer>
</body>
</html>
